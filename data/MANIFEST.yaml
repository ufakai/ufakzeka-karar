    notes: >-
      Promoted to train for its train and validation splits only, on 2026-09-22 after the
      licence was read again at the source; data/typed/instrument.py never converts a test split.
      Instrument set, 59 intents: cooking_query has no test rows in tr-TR and is dropped.
