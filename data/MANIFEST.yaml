    attribution: >-
      Mesut Demirel and Recep Karabulut, Turkish Law NLI Dataset (legal_nli_TR_V1),
      https://huggingface.co/datasets/Turkish-NLI/legal_nli_TR_V1.
    use: measure
    notes: >-
      Instrument set. Stratified subsample, seed 1, after leak removal over the whole source.
      Labels are rule-made from the distance between the Commercial Code articles two rulings
      cite; no model wrote or labelled them. Closer to precedent relatedness than to NLI.
