      unedited. Reports scraped by the compiler from six Turkish fact-checking sites.
    license_as_shown: MIT License, Copyright (c) 2026 Enes ALTUNCU
    license_id: MIT
    verified: 2026-09-23
    attribution: >-
      Enes Altuncu, "FACTurk: Insights into the Turkish Fact-Checking Ecosystem via a New Dataset",
      SIU 2026, doi:10.1109/SIU71813.2026.11636583 (MIT). Fact-checks by Teyit, Doğruluk Payı,
      Doğrula, Malumatfuruş, Yalansavar and Günün Yalanları.
    use: train
    notes: >-
      The GitHub API reports the repository licence as MIT. The README says the report text
      (`content`) was not published, but the CSV in this commit carries it for every row; it is
      the organisations' own writing, outside what the compiler can license, and
      data/typed/claims.py never reads it. File hashes are pinned in data/typed/claims.py.
  - path: data/built/typed/facturk_verdict/
    source: https://github.com/altuncu/FACTurk
    upstream: >-
      Typed training rows built by data/typed/claims.py from the folder above: the claim text,
      masked for personal data, with the normalised verdict as a five-option choice. Validation is
      a tenth carved by a hash of the claim cluster. Yalansavar's rows and pages without a verdict
      are left out. Question wording and Turkish option names written by ufak AI.
    license_as_shown: MIT License, Copyright (c) 2026 Enes ALTUNCU
    license_id: MIT
    verified: 2026-09-23
    attribution: >-
      Enes Altuncu, FACTurk, SIU 2026 (MIT). Fact-checks by Teyit, Doğruluk Payı, Doğrula,
      Malumatfuruş, Yalansavar and Günün Yalanları. Questions by ufak AI.
    use: train
    notes: >-
      Rebuilt, not edited: `python -m data.typed.claims`, which writes its counts to
      results/step3/typed/facturk_verdict.json. To be decontaminated against X-FACT.
