  # Generated decision rows.
  - path: data/built/sss/
    source: https://huggingface.co/datasets/clips/mqa
    upstream: >-
      Question and answer pairs from the tr-faq-question and tr-cqa-question configurations of
      clips/mqa, read from the hub's parquet export, filtered and masked for personal data by
      data/label/texts.py. Decision questions and option wording written by various LLMs and
      checked by rule; targets are the mean vote of two LLM judges (data/label/build.py). Split
      from results/step3/build/rows.jsonl by data/label/promote.py.
    license_as_shown: cc0-1.0
    license_id: CC0-1.0
    verified: 2026-09-23
    attribution: >-
      De Bruyn, Lotfi, Buhmann, Daelemans, "MFAQ: a Multilingual FAQ Dataset", MRQA 2021
      (clips/mqa, CC0 1.0). Questions and labels by ufak AI.
    use: train
    notes: >-
      Train, validation and held-out-task files. The held-out-task rows are for evaluation only.
      The card's licence section reads "We do not own any of the text from which these data has
      been extracted. We license the actual packaging of these data under the Creative Commons CC0
      license", the terms of web-crawl corpora such as OSCAR: sound for training, but publishing
      these rows as a dataset would republish web pages' text, so a public release of the rows
      needs its own decision (with the corpus's removal-request route in the card).

  # Converted sets for the empty tracks.
  - path: data/raw/_downloads/icgcihan__Turkish_Constutional_Court_Decisions/
    source: https://huggingface.co/datasets/icgcihan/Turkish_Constutional_Court_Decisions
