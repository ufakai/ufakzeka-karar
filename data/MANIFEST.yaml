    license_as_shown: mit
    license_id: MIT
    verified: 2026-09-19
    attribution: >-
      Cagri Toraman, Oguzhan Ozcelik, Furkan Sahinuc, Fazli Can, "MiDe22, An Annotated Multi-Event
      Tweet Dataset for Misinformation Detection", LREC-COLING 2024, pages 11283-11295.
