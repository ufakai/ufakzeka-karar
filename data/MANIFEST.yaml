    verified: 2026-09-19
    attribution: >-
      Çağrı Çöltekin, A Corpus of Turkish Offensive Language on Social Media, LREC 2020,
      pages 6174-6184, CC BY 2.0.
    use: measure
    sha256: 7977e96255dbc9b8d14893f1b14cbe3dec53c70358503c062c5a59720ec9c2f2
    notes: >-
      The card's licensing section reads "The annotations are distributed under the terms of
      Creative Commons Attribution License (CC-BY)", linked to creativecommons.org/licenses/by/2.0/.
  - path: data/raw/instrument/massive_tr/
