# License manifest. Every data file in the repo's data roots has an entry
# here, and `just check-licenses` fails the build when one is missing,
# incomplete or under a license that is not on the allow-list
# (data/licenses.py).
#
# Fields of an entry, all required unless marked optional:
#   path              a file, or a folder with a trailing slash (covers everything beneath)
#   source            the URL the data was taken from; "authored" for our own text
#   upstream          what the data derives from and how that was checked
#   license_as_shown  the license string exactly as the source shows it
#   license_id        the matching id from data/licenses.py, chosen by whoever verified it
#   verified          the date the license was read at the source, YYYY-MM-DD
#   attribution       the credit line the license asks for
#   use               train, bench, both, or measure (measured on, cleared for neither)
#   sha256            optional, for single files
#   notes             optional

version: 1

roots:
  - data/raw
  - data/built
  - bench/items
  - bench/hakembench/candidates

entries:
  - path: bench/items/smoke.jsonl
    source: authored
    upstream: original text written for this repo, derived from no other set
    license_as_shown: CC BY 4.0, authored by ufak AI
    license_id: LicenseRef-ufakai-authored
    verified: 2026-09-19
    attribution: ufak AI
    use: bench
    notes: Smoke items. They test the harness, not a model, and are not part of HakemBench.

  # The instrument. Downloaded archives and the
  # folders converted from them. Neither is tracked by git.
  - path: data/raw/_downloads/amazon-massive-dataset-1.1.tar.gz
    source: https://amazon-massive-nlu-dataset.s3.amazonaws.com/amazon-massive-dataset-1.1.tar.gz
    upstream: >-
      The MASSIVE 1.1 release archive from its publisher's bucket, the URL that the loader script of
      huggingface.co/datasets/AmazonScience/massive downloads. The archive carries its own LICENSE
      (Attribution 4.0 International) and a NOTICE saying MASSIVE localises SLURP, also CC BY 4.0.
    license_as_shown: cc-by-4.0
    license_id: CC-BY-4.0
    verified: 2026-09-19
    attribution: >-
      MASSIVE, Copyright Amazon.com Inc. or its affiliates, FitzGerald et al., arXiv:2204.08582,
      CC BY 4.0. Localised from SLURP, Bastianelli et al., EMNLP 2020, CC BY 4.0.
    use: measure
    sha256: 4cba5faa11c71437928e17cb1b9b3d8b8e727e7ea363a3a9a8045e19c0491577
    notes: All 52 locales. Only 1.1/data/tr-TR.jsonl is converted.
  - path: data/raw/_downloads/offenseval2020-turkish.zip
