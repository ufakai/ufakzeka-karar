      347a0f83d7e5f3bd74fcdf38d0684aa126b1920c, unedited, read through the hub's file resolver.
      test.json is never downloaded. Rulings of the Anayasa Mahkemesi on individual applications,
      taken by the compiler from the court's decisions database (kararlarbilgibankasi.anayasa.gov.tr);
      court decisions carry no copyright under FSEK article 31, and the compilation is CC BY 4.0.
    license_as_shown: cc-by-4.0
    license_id: CC-BY-4.0
    verified: 2026-09-23
    attribution: >-
      Cihan Erdoğanyılmaz, Berkay Mengünoğul, Muhammet Balci, "Unveiling the Black Box:
      Investigating the Interplay between AI Technologies, Explainability, and Legal Implications",
      UBMK 2023, pages 569-574 (icgcihan/Turkish_Constutional_Court_Decisions, CC BY 4.0). Rulings
      of the Anayasa Mahkemesi.
    use: train
    notes: >-
      The card's only licence statement is its metadata line "license: cc-by-4.0"; the hub API
      tags the repo license:cc-by-4.0. File hashes are pinned in data/typed/legal.py.
  - path: data/built/typed/aym_rights/
    source: https://huggingface.co/datasets/icgcihan/Turkish_Constutional_Court_Decisions
    upstream: >-
      Typed training rows built by data/typed/legal.py from the folder above: the court's summary
      of the complaint (Başvuru Konusu), masked for personal data, with the right heading (Haklar)
      as a ten-option choice. The source's train and dev files become train and validation. Question
      wording and Turkish option names written by ufak AI.
    license_as_shown: cc-by-4.0
    license_id: CC-BY-4.0
    verified: 2026-09-23
    attribution: >-
      Cihan Erdoğanyılmaz, Berkay Mengünoğul, Muhammet Balci, UBMK 2023
      (icgcihan/Turkish_Constutional_Court_Decisions, CC BY 4.0). Rulings of the Anayasa Mahkemesi.
      Questions by ufak AI.
    use: train
    notes: >-
      Rebuilt, not edited: `python -m data.typed.legal`, which writes its counts to
      results/step3/typed/aym_rights.json. The violation outcome is not converted.
  - path: data/raw/_downloads/altuncu__FACTurk/
    source: https://github.com/altuncu/FACTurk
    upstream: >-
